{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl mt-8 border border-gray-700">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-white">Editar: <span class="text-brandpink">{{ product.name }}</span></h2>
        <a href="{{ url_for('admin.dashboard') }}" class="text-gray-400 hover:text-white"><i class="fas fa-arrow-left mr-1"></i> Volver</a>
    </div>
    
    <form action="{{ url_for('admin.edit_product', id=product.id) }}" method="POST" enctype="multipart/form-data" class="space-y-6">
        
        <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Nombre del Juguete *</label>
            <input type="text" name="name" value="{{ product.name }}" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">Precio Normal (Bs.) *</label>
                <input type="number" step="0.1" name="price" value="{{ product.price }}" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-2 text-pink-400">Precio Oferta (Bs.)</label>
                <input type="number" step="0.1" name="discount_price" value="{{ product.discount_price or '' }}" placeholder="Opcional" class="w-full bg-gray-900 border border-pink-900 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">Stock *</label>
                <input type="number" name="stock" value="{{ product.stock_quantity }}" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Categoría *</label>
            <select name="category_id" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink appearance-none">
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="p-4 border border-gray-700 rounded-xl bg-gray-900/50">
            <label class="block text-sm font-semibold mb-2 text-gray-300">Actualizar Imagen (Opcional)</label>
            <div class="flex items-center gap-4">
                {% if product.main_image %}
                <img src="{{ url_for('static', filename='img/uploads/' + product.main_image) }}" class="w-16 h-16 object-cover rounded-lg border border-gray-600">
                {% endif %}
                <input type="file" name="image" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brandpink file:text-white hover:file:bg-pink-600 cursor-pointer">
            </div>
        </div>

        <button type="submit" class="w-full bg-brandpink hover:bg-pink-600 text-white font-bold py-4 rounded-xl transition shadow-lg mt-8">
            <i class="fas fa-save mr-2"></i> Guardar Cambios
        </button>
    </form>
</div>
{% endblock %}
