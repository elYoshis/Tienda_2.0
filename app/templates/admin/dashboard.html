{% extends 'base.html' %}
{% block content %}
<div class="max-w-4xl mx-auto bg-gray-800 p-6 rounded-2xl shadow-lg">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-pink-300">Panel de Administración</h1>
        <a href="{{ url_for('admin.add_product') }}" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-full font-semibold transition">
            + Nuevo Juguete
        </a>
    </div>

    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="border-b border-gray-700 text-gray-400">
                <th class="p-3">ID</th>
                <th class="p-3">Nombre</th>
                <th class="p-3">Precio</th>
                <th class="p-3">Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr class="border-b border-gray-700 hover:bg-gray-700 transition">
                <td class="p-3">{{ product.id }}</td>
                <td class="p-3 font-semibold">{{ product.name }}</td>
                <td class="p-3 text-pink-400">Bs. {{ product.price }}</td>
                <td class="p-3">{{ product.stock_quantity }}</td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="p-3 text-gray-500 text-center">No hay juguetes registrados.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
