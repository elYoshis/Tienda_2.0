{% extends 'base.html' %} {% block content %}
<div class="max-w-lg mx-auto bg-gray-800 p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-pink-300 mb-6">Agregar Nuevo Juguete</h2>

    <form action="{{ url_for('admin.add_product') }}" method="POST" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Nombre del Juguete</label>
            <input type="text" name="name" required
                class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500" />
        </div>

        <!-- Reemplaza el bloque de Precio y Stock con esto: -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Precio Normal -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-300">Precio Normal (Bs.) *</label>
                <input type="number" step="0.1" name="price" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
            </div>
            
            <!-- NUEVO: Precio de Oferta -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-pink-400">Precio Oferta (Bs.)</label>
                <input type="number" step="0.1" name="discount_price" placeholder="Opcional" class="w-full bg-gray-900 border border-pink-900 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink placeholder-gray-600">
                <p class="text-[10px] text-gray-500 mt-1">Si lo llenas, irá a Ofertas.</p>
            </div>

            <!-- Stock -->
            <div>
                <label class="block text-sm font-semibold mb-1 text-gray-300">Stock *</label>
                <input type="number" name="stock" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-brandpink">
            </div>
        </div>
<!-- (El resto del formulario de Categoría e Imagen sigue igual debajo de esto) -->

        <div>
            <label class="block text-sm font-semibold mb-1">Categoría</label>
            <select name="category_id" required
                class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500">
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1">Imagen del Juguete (Opcional)</label>
            <input type="file" name="image" accept="image/*"
                class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-gray-400 focus:outline-none focus:border-pink-500" />
        </div>

        <button type="submit"
            class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-lg transition mt-4">
            Guardar Producto
        </button>
    </form>
</div>
{% endblock %}
