{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-gray-800 p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-pink-300 mb-6">Agregar Nuevo Juguete</h2>
    
    <form action="{{ url_for('admin.add_product') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-1">Nombre del Juguete</label>
            <input type="text" name="name" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Precio (Bs.)</label>
                <input type="number" step="0.1" name="price" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Stock</label>
                <input type="number" name="stock" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-1">Categoría</label>
            <select name="category_id" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-pink-500">
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-lg transition mt-4">
            Guardar Producto
        </button>
    </form>
</div>
{% endblock %}
