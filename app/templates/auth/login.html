{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-3xl shadow-2xl mt-10 border border-gray-700">
    <div class="text-center mb-8">
        <div class="text-4xl mb-4">🔒</div>
        <h2 class="text-2xl font-bold text-pink-300">Acceso Administrativo</h2>
    </div>
    
    <!-- Mostrar mensajes de error -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg mb-6 text-center text-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-6">
        <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Usuario</label>
            <input type="text" name="username" required class="w-full bg-gray-900 border border-gray-600 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
        </div>
        
        <div>
            <label class="block text-sm font-semibold mb-2 text-gray-300">Contraseña</label>
            <input type="password" name="password" required class="w-full bg-gray-900 border border-gray-600 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition">
        </div>

        <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl transition shadow-lg hover:shadow-pink-500/25">
            Ingresar al Panel
        </button>
    </form>
</div>
{% endblock %}
